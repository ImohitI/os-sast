[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "os-sast"
version = "0.1.0"
description = "Runs open-source SAST scanners, merges their output into one format, and optionally asks an LLM (local Ollama, OpenAI-compatible, Anthropic or AWS Bedrock) to triage each finding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# opengrep is a standalone binary, not on PyPI: see README
scanners = ["bandit>=1.8"]
# only for --ai-provider bedrock (AWS request signing); the other providers use the standard library
bedrock = ["boto3>=1.35"]
dev = ["pytest>=8", "jsonschema>=4.22"]

[project.scripts]
os-sast = "os_sast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
os_sast = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
