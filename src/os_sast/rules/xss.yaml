# CWE-79: user input is written into an HTML response without escaping.
rules:
  - id: php-reflected-xss
    languages: [php]
    severity: WARNING
    message: Request input is echoed into the page. Escape it with htmlspecialchars($x, ENT_QUOTES, 'UTF-8').
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sanitizers:
      - pattern-either:
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: intval(...)
    pattern-sinks:
      - pattern-either:
          - pattern: echo ...;
          - pattern: print(...)
          - pattern: printf(...)

  - id: js-reflected-xss
    languages: [javascript, typescript]
    severity: WARNING
    message: Request input is sent back in the response body without escaping.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.body
          - pattern: $REQ.params
    pattern-sanitizers:
      - pattern-either:
          - pattern: escape(...)
          - pattern: escapeHtml(...)
          - pattern: encodeURIComponent(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($BODY)
              - pattern: $RES.write($BODY)
          - focus-metavariable: $BODY

  - id: java-reflected-xss
    languages: [java]
    severity: WARNING
    message: Request parameter is written to the response without HTML encoding.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
    mode: taint
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).getParameter(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (HttpServletResponse $RESP).getWriter().$W($BODY)
          - metavariable-regex:
              metavariable: $W
              regex: ^(print|println|write|append)$
          - focus-metavariable: $BODY
